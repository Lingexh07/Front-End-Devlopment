<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Effect</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f4f4f4;
    font-family:Arial, sans-serif;
}

.card{
    width:300px;
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
    transition:0.3s ease;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 8px 16px rgba(0,0,0,0.3);
}

button{
    padding:10px 20px;
    border:none;
    background:orange;
    color:white;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:darkorange;
}
</style>
</head>
<body>

<div class="card">
    <h2>Hover Me</h2>
    <p>This card moves up when you hover over it.</p>
    <button>Learn More</button>
</div>

</body>
</html>
