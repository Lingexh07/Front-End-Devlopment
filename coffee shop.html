<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Shop</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.products{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    width:220px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    text-align:center;
}

.card img{
    width:100%;
    border-radius:10px;
}

button{
    background:brown;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#5c2c06;
}

.cart{
    margin-top:40px;
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
}

li{
    margin:10px 0;
}
</style>
</head>
<body>

<h1>☕ Coffee Shop</h1>

<div class="products">

    <div class="card">
        <img src="https://via.placeholder.com/200x150" alt="Espresso">
        <h3>Espresso</h3>
        <p>₹120</p>
        <button onclick="addToCart('Espresso',120)">
            Add to Cart
        </button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200x150" alt="Cappuccino">
        <h3>Cappuccino</h3>
        <p>₹180</p>
        <button onclick="addToCart('Cappuccino',180)">
            Add to Cart
        </button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200x150" alt="Latte">
        <h3>Latte</h3>
        <p>₹200</p>
        <button onclick="addToCart('Latte',200)">
            Add to Cart
        </button>
    </div>

</div>

<div class="cart">
    <h2>🛒 Cart</h2>
    <ul id="cartItems"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
</div>

<script>
let total = 0;

function addToCart(product, price){

    const cartItems =
        document.getElementById("cartItems");

    const li = document.createElement("li");
    li.textContent = `${product} - ₹${price}`;

    cartItems.appendChild(li);

    total += price;
    document.getElementById("total").textContent = total;
}
</script>

</body>
</html>
